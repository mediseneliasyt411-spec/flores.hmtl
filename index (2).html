<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Una sorpresa para ti 🌼</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#fff;
  background:radial-gradient(circle at 50% 25%,#242033 0%,#11111a 48%,#06070b 100%);
}
.page{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding:24px;opacity:1;transition:opacity .7s ease,transform .7s ease;
}
.page.hide{opacity:0;pointer-events:none;transform:scale(.97)}
.message-card{
  width:min(92vw,520px);text-align:center;padding:30px 22px 25px;
  border:1px solid rgba(255,255,255,.12);border-radius:28px;
  background:rgba(255,255,255,.055);backdrop-filter:blur(16px);
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}
.envelope{font-size:42px;margin-bottom:10px}
.message-card h1{font-size:21px;margin:0 0 18px;font-weight:700;color:#f7d96b}
.message{
  margin:0 auto;color:#fff;font-size:clamp(18px,4.8vw,24px);
  line-height:1.48;font-weight:600;
}
.next{
  margin-top:25px;border:0;border-radius:999px;padding:14px 25px;
  font-size:16px;font-weight:800;color:#271b00;cursor:pointer;
  background:linear-gradient(135deg,#ffe86a,#ffb300);
  box-shadow:0 8px 30px rgba(255,187,0,.25);
}
.next:active{transform:scale(.96)}
.hint{font-size:12px;color:#aaa6b5;margin-top:12px}

/* FLOWER SCENE */
#flowerPage{display:block;padding:0}
.scene{
  position:absolute;inset:0;overflow:hidden;
  display:flex;justify-content:center;
}
.flowerTitle{
  position:absolute;top:8%;left:50%;transform:translateX(-50%);
  width:90%;text-align:center;z-index:20;
  font-size:clamp(18px,5vw,27px);font-weight:700;
  color:#f8dc72;text-shadow:0 2px 18px #000;
  opacity:0;animation:fadeDown 1s .2s forwards;
}
.smallText{
  position:absolute;top:13.5%;left:50%;transform:translateX(-50%);
  z-index:20;width:90%;text-align:center;color:#c9c5d1;font-size:12px;
  letter-spacing:1.5px;text-transform:uppercase;opacity:0;
  animation:fadeDown 1s .45s forwards;
}
.bouquet{
  position:absolute;left:50%;bottom:4%;width:min(92vw,440px);height:min(72vh,650px);
  transform:translateX(-50%);
  opacity:0;animation:rise 1.5s .45s cubic-bezier(.18,.8,.2,1) forwards;
}
.stems{position:absolute;left:50%;bottom:4%;width:100%;height:58%;z-index:1}
.stem{
  position:absolute;bottom:0;left:50%;width:6px;height:92%;
  border-radius:10px;background:linear-gradient(#79aa42,#315d28);
  transform-origin:bottom;
}
.stem:nth-child(1){transform:rotate(-28deg);height:82%}
.stem:nth-child(2){transform:rotate(-14deg);height:93%}
.stem:nth-child(3){transform:rotate(0);height:100%}
.stem:nth-child(4){transform:rotate(14deg);height:93%}
.stem:nth-child(5){transform:rotate(28deg);height:82%}

.flowers{position:absolute;inset:0;z-index:5}
.flower{
  position:absolute;width:108px;height:108px;
  transform:translate(-50%,-50%) scale(0);
  animation:bloom .9s cubic-bezier(.2,.9,.2,1) forwards;
  filter:drop-shadow(0 5px 16px rgba(255,188,0,.42));
}
.f1{left:50%;top:25%;animation-delay:1s}
.f2{left:31%;top:37%;animation-delay:1.25s}
.f3{left:69%;top:37%;animation-delay:1.45s}
.f4{left:41%;top:18%;animation-delay:1.65s}
.f5{left:59%;top:18%;animation-delay:1.85s}

.petal{
  position:absolute;left:50%;top:50%;width:32px;height:59px;
  margin:-29.5px -16px;border-radius:55% 55% 48% 48%;
  background:linear-gradient(90deg,#ffad00,#fff06a 48%,#ff9c00);
  transform-origin:50% 100%;
}
.petal:nth-child(1){transform:rotate(0) translateY(-26px)}
.petal:nth-child(2){transform:rotate(45deg) translateY(-26px)}
.petal:nth-child(3){transform:rotate(90deg) translateY(-26px)}
.petal:nth-child(4){transform:rotate(135deg) translateY(-26px)}
.petal:nth-child(5){transform:rotate(180deg) translateY(-26px)}
.petal:nth-child(6){transform:rotate(225deg) translateY(-26px)}
.petal:nth-child(7){transform:rotate(270deg) translateY(-26px)}
.petal:nth-child(8){transform:rotate(315deg) translateY(-26px)}
.center{
  position:absolute;left:50%;top:50%;width:29px;height:29px;
  transform:translate(-50%,-50%);border-radius:50%;
  background:#572500;box-shadow:0 0 0 5px #ffcf25;
}
.leaves{position:absolute;bottom:22%;left:50%;width:100%;height:28%;z-index:2}
.leaf{
  position:absolute;width:75px;height:27px;background:#4d8a2d;
  border-radius:100% 0 100% 0;opacity:.95;
}
.l1{left:18%;bottom:25%;transform:rotate(24deg)}
.l2{left:67%;bottom:30%;transform:scaleX(-1) rotate(24deg)}
.l3{left:31%;bottom:5%;transform:rotate(-8deg)}
.l4{left:54%;bottom:7%;transform:scaleX(-1) rotate(-8deg)}

.ribbon{
  position:absolute;z-index:10;left:50%;bottom:8%;
  width:130px;height:82px;transform:translateX(-50%);
  opacity:0;animation:ribbonIn .8s 2.2s forwards;
}
.ribbon:before,.ribbon:after{
  content:"";position:absolute;top:8px;width:59px;height:55px;
  background:#e9334b;border-radius:12px 35px 12px 35px;
}
.ribbon:before{left:2px;transform:rotate(25deg)}
.ribbon:after{right:2px;transform:scaleX(-1) rotate(25deg)}
.knot{
  position:absolute;z-index:3;left:50%;top:16px;transform:translateX(-50%);
  width:34px;height:34px;border-radius:50%;background:#ff4a5e;
}
.tail{
  position:absolute;z-index:1;left:50%;top:35px;width:25px;height:53px;
  transform:translateX(-50%) rotate(7deg);background:#d9273e;
  clip-path:polygon(0 0,100% 0,80% 100%,50% 78%,20% 100%);
}
.sparkles{position:absolute;inset:0;z-index:15;pointer-events:none}
.spark{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:#fff1a1;box-shadow:0 0 15px 5px #ffdf55;
  animation:twinkle 2.4s infinite ease-in-out;
}
.s1{left:17%;top:35%}.s2{left:82%;top:44%;animation-delay:.5s}
.s3{left:25%;top:63%;animation-delay:1s}.s4{left:76%;top:68%;animation-delay:1.5s}
.s5{left:50%;top:29%;animation-delay:.8s}
.floor{
  position:absolute;bottom:-14%;left:50%;transform:translateX(-50%);
  width:115%;height:34%;border-radius:50%;
  background:radial-gradient(ellipse,#171321 0,#08090e 62%,transparent 70%);
}

@keyframes fadeDown{to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(100px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes bloom{to{transform:translate(-50%,-50%) scale(1)}}
@keyframes ribbonIn{to{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}

@media(max-height:650px){
  .flowerTitle{top:4%}.smallText{top:10%}
  .bouquet{height:70vh;bottom:1%}
}
</style>
</head>
<body>

<section id="messagePage" class="page">
  <div class="message-card">
    <div class="envelope">💌</div>
    <h1>Un pequeño mensaje para ti</h1>
    <p class="message">
      Se que no nos conocemos bien Pero quiero decirte que te aprecio y la verdad no sé
      siento que sería algo lindo y ojalá poder tener la oportunidad de estar contigo 😔🙏 o salir
    </p>
    <button class="next" onclick="openFlower()">Tengo una sorpresa para ti 🌼</button>
    <div class="hint">Toca el botón cuando estés lista/o ✨</div>
  </div>
</section>

<section id="flowerPage" class="page hide">
  <div class="scene">
    <div class="flowerTitle">Tengo una sorpresa para ti 🌼</div>
    <div class="smallText">Espero que te guste</div>

    <div class="bouquet">
      <div class="flowers">
        <div class="flower f1"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div>
        <div class="flower f2"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div>
        <div class="flower f3"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div>
        <div class="flower f4"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div>
        <div class="flower f5"><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><i class="petal"></i><b class="center"></b></div>
      </div>

      <div class="stems">
        <div class="stem"></div><div class="stem"></div><div class="stem"></div>
        <div class="stem"></div><div class="stem"></div>
      </div>

      <div class="leaves">
        <div class="leaf l1"></div><div class="leaf l2"></div>
        <div class="leaf l3"></div><div class="leaf l4"></div>
      </div>

      <div class="ribbon"><div class="tail"></div><div class="knot"></div></div>
    </div>

    <div class="sparkles">
      <span class="spark s1"></span><span class="spark s2"></span>
      <span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span>
    </div>
    <div class="floor"></div>
  </div>
</section>

<script>
function openFlower(){
  document.getElementById('messagePage').classList.add('hide');
  setTimeout(()=>document.getElementById('flowerPage').classList.remove('hide'),350);
}
</script>
</body>
</html>
